<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1">
  <title>Gen6 個体管理（ローカル）</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA: ホーム画面に追加してオフラインでも使えるようにするための設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b7cff">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- iOSのホーム画面追加アプリ向け設定（Safariのアドレスバー等を非表示にしてアプリらしく表示する） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gen6管理">
</head>
<body>
  <!-- <header>
    <h1>育成個体リスト（ローカル表示用）</h1>
  </header> -->
  <div class="container">
    <div class="controls">
      <!-- ヘッダー操作部：2行4列のグリッド。各行・各列の開始/終了位置を揃える -->
      <div class="controls-grid">
        <!-- 1行1列: 検索 -->
        <input id="q" type="text" placeholder="検索" class="grid-cell" onfocus="this.select()"/>
        <!-- 1行2列: 絞り込み（開閉でラベルが ＋絞り込み / －絞り込み に変わる） -->
        <button id="toggle-advanced" class="grid-cell ctrl-btn" aria-expanded="false" title="詳細検索を開く">＋絞り込み</button>
        <!-- 1行3列: 通常/メガ（盾/剣と同じ見た目の切り替えボタン） -->
        <div class="form-buttons grid-cell" id="adv-mega-buttons">
          <button type="button" class="btn active" data-mega="off">通常</button>
          <button type="button" class="btn secondary" data-mega="on">メガ</button>
        </div>
        <!-- 1行4列: 新規作成 -->
        <button id="add-instance-btn" class="grid-cell ctrl-btn" title="新しい個体を追加">新規作成</button>

        <!-- 2行1列: ソート（並び替え基準＋昇順/降順を一体化） -->
        <div class="sort-group grid-cell">
          <select id="adv-sort-field">
            <option value="S">S</option>
            <option value="A">A</option>
            <option value="C">C</option>
            <option value="AorC">AorC</option>
            <option value="dex">図鑑番号</option>
          </select>
          <button id="adv-sort-dir" type="button">降順</button>
        </div>
        <!-- 2行2列: リセット -->
        <button id="reset" class="grid-cell ctrl-btn">リセット</button>
        <!-- 2行3列: 盾/剣（変更なし） -->
        <div class="form-buttons grid-cell" id="adv-form-buttons">
          <button type="button" class="btn active">盾</button>
          <button type="button" class="btn secondary">剣</button>
        </div>
        <!-- 2行4列: 入出力（処理は後日実装） -->
        <button id="io-btn" class="grid-cell ctrl-btn" title="入出力（今後実装予定）">入出力</button>
      </div>

      <!-- 詳細パネル（初期は非表示）。グリッドの下に全幅で展開する -->
      <div id="advanced-search" class="adv-panel" aria-hidden="true" style="display:none;margin:8px 0; width:100%">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div>
            <label>ポケモン名</label>
            <input id="adv-name" placeholder="ポケモン名で絞り込み" class="search-area" onfocus="this.select()"/>
          </div>
          <div>
            <label>特性</label>
            <input id="adv-ability" placeholder="特性で絞り込み" class="search-area" onfocus="this.select()"/>
          </div>
        </div>

        <!-- タイプ -->
        <div style="margin-top:8px;border:1px solid #ddd;border-radius:6px;padding:8px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <label style="min-width:80px">タイプ</label>
            <label style="display:inline-flex;align-items:center;gap:6px"><input type="radio" name="type-mode" value="AND" /> AND</label>
            <label style="display:inline-flex;align-items:center;gap:6px"><input type="radio" name="type-mode" value="OR" /> OR</label>
            <button id="type-clear-all" class="small" title="タイプを全てクリア">クリア</button>
          </div>
          <div id="type-rows" style="display:flex;flex-direction:column;gap:6px"></div>
        </div>

        <!-- 技 -->
        <div style="margin-top:8px;border:1px solid #ddd;border-radius:6px;padding:8px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <label style="min-width:80px">技</label>
            <label style="display:inline-flex;align-items:center;gap:6px"><input type="radio" name="move-mode" value="AND" /> AND</label>
            <label style="display:inline-flex;align-items:center;gap:6px"><input type="radio" name="move-mode" value="OR" /> OR</label>
            <button id="move-clear-all" class="small" title="技を全てクリア">クリア</button>
          </div>
          <div id="move-rows" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
        </div>

        <div style="margin-top:8px;display:flex;gap:12px;align-items:center">
          <div>
            <label>メガ</label>
            <select id="adv-mega">
              <option value="-">-</option>
              <option value="only">メガのみ</option>
              <option value="exclude">メガを除外</option>
            </select>
          </div>
          <div>
            <label>メモ (詳細)</label>
            <input id="adv-memo" placeholder="メモで絞り込み" class="search-area" onfocus="this.select()"/>
          </div>
        </div>

        <div style="margin-top:8px;display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:8px;align-items:center">
          <div style="display:flex;flex-direction:column;gap:3px;margin-right:5px">
            <label style="margin:0"><input type="checkbox" id="cat-normal" checked /> <span style="white-space:nowrap">一般</span></label>
            <label style="margin:0"><input type="checkbox" id="cat-legend" /> <span style="white-space:nowrap">禁伝</span></label>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px;margin-right:20px">
            <label style="margin:0"><input type="checkbox" id="cat-ub" checked /> <span style="white-space:nowrap">準伝</span></label>
            <label style="margin:0"><input type="checkbox" id="cat-myth" /> <span style="white-space:nowrap">幻</span></label>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px">
            <label style="margin:0"><input type="checkbox" id="cat-raised" /> <span style="white-space:nowrap">育成済み</span></label>
            <label style="margin:0"><input type="checkbox" id="cat-unraised" /> <span style="white-space:nowrap">未育成</span></label>
          </div>
        </div>
      </div>
    </div>
    <div id="list" class="list"></div>
  </div>

  <div id="modal" class="modal" role="dialog" aria-hidden="true">
    <div class="modal-stack">
      <!-- 編集ボタン：モーダルの枠外（パネルの上）に配置 -->
      <button id="editModalBtn" type="button" class="edit-toggle-btn edit-toggle-btn-outside">編集</button>
      <div class="panel">
        <div class="row">
          <p id="m_name">ポケモン名</p>
          <!-- レベルはフォルムボタンと同じ見た目の2択ボタンにする -->
          <div class="form-buttons" id="m_level" style="margin-left:12px"></div>
        </div>
        <!-- 特性/道具/性格（左・幅固定）と 性別/育成済み/色違い（右） を2列で並べる -->
        <div id="m_props_grid" class="m_props_grid">
          <div id="m_ability" class="meta"></div>
          <div id="m_gender" class="meta"></div>

          <div id="m_item_prop" class="meta"></div>
          <label class="m_checkbox_label"><input type="checkbox" id="m_raised_checkbox" disabled /> 育成済み</label>

          <div id="m_nature" class="meta"></div>
          <label class="m_checkbox_label"><input type="checkbox" id="m_shiny_checkbox" disabled /> 色違い</label>
        </div>
        <!-- フォルムボタン（盾/剣・メガ等）。道具欄の右下に絶対配置される（JS側で位置計算） -->
        <div class="form-buttons" id="formButtons"></div>
        <div id="m_stats" style="margin-top:8px"></div>
        <div id="m_more" style="margin-top:8px"></div>
      </div>
    </div>
    <!-- close button moved outside panel so it won't be clipped by panel's overflow -->
    <button id="closeModal" class="close-btn" aria-label="閉じる" style="font-size: 20px;">×</button>
  </div>


  <!-- 固定データ（種族・性格・タイプ相性など）。開発者がこのファイルを直接編集して更新する -->
  <script src="gen6-constants.js"></script>
  <!-- ユーザー編集対象データ（instances）の初期シード。IndexedDBが空の場合の初回投入データとして使用 -->
  <script src="gen6-initial-instances.js"></script>
  <!-- IndexedDB アクセス層（instancesの永続化・Persistent Storageの要求/確認） -->
  <script src="gen6-db.js"></script>
  <!-- 画面ロジック本体 -->
  <script src="app.js"></script>

  <!-- PWA: Service Workerを登録し、アプリ本体を圏外でも読み込めるようにする。
       登録に失敗してもアプリ自体（IndexedDBを使った通常の動作）には影響しない。 -->
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('service-worker.js').catch((err)=>{
          console.warn('Service Workerの登録に失敗しました（オフライン動作ができない可能性がありますが、通常の動作には影響ありません）', err);
        });
      });
    }
  </script>
</body>
</html>
